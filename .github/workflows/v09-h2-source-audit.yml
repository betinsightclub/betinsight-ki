name: v0.9 H2 source audit

on:
  push:
    branches:
      - research/v09-h2-audit

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v09-h2-audit

      - name: Download original basketball database
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v09db research
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/PranavSitaraman/NBA-Injury-Betting/main/basketball-final.sqlite.zip \
            -o /tmp/v09db/basketball-final.sqlite.zip
          unzip -o /tmp/v09db/basketball-final.sqlite.zip -d /tmp/v09db
          ls -lh /tmp/v09db

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Audit BettingOdds_History and halftime consistency
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          import numpy as np
          import pandas as pd

          db = Path('/tmp/v09db/basketball-final.sqlite')
          con = sqlite3.connect(db)

          tables = pd.read_sql_query("SELECT name, sql FROM sqlite_master WHERE type='table' ORDER BY name", con)
          Path('research/v09_sqlite_schema.txt').write_text(
              '\n\n'.join(f"TABLE {r['name']}\n{r['sql']}" for _, r in tables.iterrows()),
              encoding='utf-8'
          )

          df = pd.read_sql_query('SELECT * FROM BettingOdds_History', con)
          df['_date'] = pd.to_datetime(df['Date'], errors='coerce')
          for c in ['HomeSpread_AtOpen','HomeSpread_AtClose','Over_AtOpen','Over_AtClose','2H_HomeSpread','2H_Over']:
              df[c] = pd.to_numeric(df[c], errors='coerce')

          hs_open = df['HomeSpread_AtOpen']
          hs_close = df['HomeSpread_AtClose']
          h2 = df['2H_HomeSpread']
          valid_close = hs_close.notna() & h2.notna() & (hs_close != 0) & (h2 != 0)
          valid_open = hs_open.notna() & h2.notna() & (hs_open != 0) & (h2 != 0)
          same_close = np.sign(hs_close[valid_close]) == np.sign(h2[valid_close])
          same_open = np.sign(hs_open[valid_open]) == np.sign(h2[valid_open])

          q = pd.read_sql_query('''
              SELECT GAME_ID,
                     PTS_QTR1_HOME, PTS_QTR2_HOME, PTS_QTR3_HOME, PTS_QTR4_HOME,
                     PTS_QTR1_AWAY, PTS_QTR2_AWAY, PTS_QTR3_AWAY, PTS_QTR4_AWAY,
                     PTS_HOME_y, PTS_AWAY
              FROM Game_FullDetails
          ''', con)
          for c in q.columns:
              if c != 'GAME_ID': q[c] = pd.to_numeric(q[c], errors='coerce')
          q['ht_home'] = q['PTS_QTR1_HOME'] + q['PTS_QTR2_HOME']
          q['ht_away'] = q['PTS_QTR1_AWAY'] + q['PTS_QTR2_AWAY']
          q['ht_margin'] = q['ht_home'] - q['ht_away']
          q['ht_total'] = q['ht_home'] + q['ht_away']
          q['second_half_margin_no_ot'] = (q['PTS_QTR3_HOME'] + q['PTS_QTR4_HOME']) - (q['PTS_QTR3_AWAY'] + q['PTS_QTR4_AWAY'])
          q['second_half_margin_with_ot'] = (q['PTS_HOME_y'] - q['PTS_AWAY']) - q['ht_margin']
          q = q.drop_duplicates('GAME_ID')
          m = df.merge(q, on='GAME_ID', how='left')

          mv = m['HomeSpread_AtClose'].notna() & m['2H_HomeSpread'].notna() & (m['HomeSpread_AtClose'] != 0) & (m['2H_HomeSpread'] != 0)
          m['sign_flip_close_to_h2'] = False
          m.loc[mv, 'sign_flip_close_to_h2'] = np.sign(m.loc[mv,'HomeSpread_AtClose']) != np.sign(m.loc[mv,'2H_HomeSpread'])
          m['pregame_home_expected_margin'] = -m['HomeSpread_AtClose']
          m['h2_home_expected_margin'] = -m['2H_HomeSpread']
          m['ht_margin_surprise_vs_fullgame_half'] = m['ht_margin'] - (m['pregame_home_expected_margin']/2.0)

          flip = m[m['sign_flip_close_to_h2'] & m['ht_margin'].notna()].copy()
          noflip = m[(~m['sign_flip_close_to_h2']) & mv & m['ht_margin'].notna()].copy()

          def stats(s):
              return {
                  'n': int(len(s)),
                  'ht_margin_mean': float(s['ht_margin'].mean()) if len(s) else None,
                  'ht_margin_abs_mean': float(s['ht_margin'].abs().mean()) if len(s) else None,
                  'ht_surprise_mean': float(s['ht_margin_surprise_vs_fullgame_half'].mean()) if len(s) else None,
                  'ht_surprise_abs_mean': float(s['ht_margin_surprise_vs_fullgame_half'].abs().mean()) if len(s) else None,
              }

          summary = {
              'db_bytes': db.stat().st_size,
              'rows': int(len(df)),
              'columns': list(df.columns.drop('_date')),
              'date_min': str(df['_date'].min()),
              'date_max': str(df['_date'].max()),
              'valid_nonzero_close_h2': int(valid_close.sum()),
              'same_sign_close_h2': int(same_close.sum()),
              'opposite_sign_close_h2': int((~same_close).sum()),
              'same_sign_close_h2_rate': float(same_close.mean()),
              'valid_nonzero_open_h2': int(valid_open.sum()),
              'same_sign_open_h2': int(same_open.sum()),
              'opposite_sign_open_h2': int((~same_open).sum()),
              'same_sign_open_h2_rate': float(same_open.mean()),
              'quarter_join_rows': int(m['ht_margin'].notna().sum()),
              'h2_abs_gt_20': int((m['2H_HomeSpread'].abs() > 20).sum()),
              'h2_abs_gt_30': int((m['2H_HomeSpread'].abs() > 30).sum()),
              'h2_abs_gt_50': int((m['2H_HomeSpread'].abs() > 50).sum()),
              'h2_over_lt_60': int((m['2H_Over'] < 60).sum()),
              'h2_over_gt_150': int((m['2H_Over'] > 150).sum()),
              'flip_stats': stats(flip),
              'no_flip_stats': stats(noflip),
              'dev_rows_2013_2017': int(((df['_date'] >= '2013-07-01') & (df['_date'] < '2017-07-01')).sum()),
          }

          for threshold in [5, 10, 15, 20]:
              elig = m[mv & m['ht_margin_surprise_vs_fullgame_half'].notna() & (m['ht_margin_surprise_vs_fullgame_half'].abs() >= threshold)]
              summary[f'flip_rate_abs_ht_surprise_ge_{threshold}'] = float(elig['sign_flip_close_to_h2'].mean()) if len(elig) else None
              summary[f'n_abs_ht_surprise_ge_{threshold}'] = int(len(elig))

          inspect_cols = [
              'GAME_ID','Date','HomeTeam','AwayTeam','HomeSpread_AtOpen','HomeSpread_AtClose',
              '2H_HomeSpread','Over_AtClose','2H_Over','ht_home','ht_away','ht_margin',
              'pregame_home_expected_margin','h2_home_expected_margin','ht_margin_surprise_vs_fullgame_half',
              'second_half_margin_no_ot','second_half_margin_with_ot','sign_flip_close_to_h2'
          ]
          m.loc[m['sign_flip_close_to_h2'], inspect_cols].head(500).to_csv('research/v09_flip_examples_with_halftime.csv', index=False)
          m.loc[m['2H_HomeSpread'].abs() > 20, inspect_cols].to_csv('research/v09_extreme_h2_spread_rows.csv', index=False)
          m.loc[(m['_date'] >= '2013-07-01') & (m['_date'] < '2017-07-01'), inspect_cols].to_csv('research/v09_dev_joined.csv', index=False)

          Path('research/v09_h2_source_audit.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          con.close()
          PY

      - name: Commit audit outputs to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/v09_*
          git commit -m "Extend v0.9 H2 source audit with halftime checks" || exit 0
          git push origin HEAD:research/v09-h2-audit
