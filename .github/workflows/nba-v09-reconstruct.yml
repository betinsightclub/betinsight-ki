name: NBA v0.9 reconstruction audit

on:
  push:
    branches:
      - research/nba-v09-reconstruct
    paths:
      - 'research/**'
      - '.github/workflows/nba-v09-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Reproduce exact stored baselines from SQLite
        run: python research/nba_v09_exact_baseline.py
