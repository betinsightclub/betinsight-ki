name: NBA v0.9 reconstruction audit

on:
  push:
    branches:
      - research/nba-v09-reconstruct
    paths:
      - 'research/**'
      - '.github/workflows/nba-v09-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and inspect original basketball SQLite
        run: python research/nba_v09_sqlite_audit.py
