name: NBA v0.9 reconstruction audit

on:
  push:
    branches:
      - research/nba-v09-reconstruct
    paths:
      - 'research/**'
      - '.github/workflows/nba-v09-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Fingerprint context Ridge definitions and walk-forward convention
        run: python research/nba_v09_context_fingerprint.py
