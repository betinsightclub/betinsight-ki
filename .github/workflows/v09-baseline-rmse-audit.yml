name: v0.9 baseline RMSE convention audit

on:
  push:
    branches:
      - research/v09-h2-audit

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v09-h2-audit
      - name: Download original database
        run: |
          mkdir -p /tmp/v09db research
          curl -L --fail --retry 3 https://raw.githubusercontent.com/PranavSitaraman/NBA-Injury-Betting/main/basketball-final.sqlite.zip -o /tmp/v09db/db.zip
          unzip -o /tmp/v09db/db.zip -d /tmp/v09db
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Identify exact v0.9 clean sample
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          import numpy as np
          import pandas as pd
          con=sqlite3.connect('/tmp/v09db/basketball-final.sqlite')
          b=pd.read_sql_query('SELECT GAME_ID,Date,HomeTeam,AwayTeam,HomeSpread_AtOpen,HomeSpread_AtClose,Over_AtOpen,Over_AtClose,`2H_HomeSpread`,`2H_Over` FROM BettingOdds_History',con)
          r=pd.read_sql_query('SELECT DISTINCT GAME_ID FROM Game',con)
          q=pd.read_sql_query('SELECT GAME_ID,PTS_QTR1_HOME,PTS_QTR2_HOME,PTS_QTR1_AWAY,PTS_QTR2_AWAY,PTS_HOME_y,PTS_AWAY FROM Game_FullDetails',con).drop_duplicates('GAME_ID')
          con.close()
          b['Date']=pd.to_datetime(b.Date,errors='coerce')
          odds=['HomeSpread_AtOpen','HomeSpread_AtClose','Over_AtOpen','Over_AtClose','2H_HomeSpread','2H_Over']
          for c in odds:b[c]=pd.to_numeric(b[c],errors='coerce')
          for c in q.columns:
            if c!='GAME_ID':q[c]=pd.to_numeric(q[c],errors='coerce')
          m=b.merge(r,on='GAME_ID').merge(q,on='GAME_ID')
          m['ht_margin']=(m.PTS_QTR1_HOME+m.PTS_QTR2_HOME)-(m.PTS_QTR1_AWAY+m.PTS_QTR2_AWAY)
          m['actual_withot']=(m.PTS_HOME_y-m.PTS_AWAY)-m.ht_margin
          m['expected']=-m['2H_HomeSpread']
          periods={'2017/18':('2017-07-01','2018-07-01',1230,9.883179436414059),'2018/19':('2018-07-01','2019-07-01',1230,10.19949385002746),'2019/20':('2019-07-01','2020-10-01',1054,10.337244979978518),'2020/21':('2020-10-01','2021-08-01',1075,10.484913874395364),'2021/22_partial':('2021-08-01','2021-12-21',454,10.785751740306479)}
          req=['HomeSpread_AtOpen','HomeSpread_AtClose','Over_AtOpen','Over_AtClose','2H_HomeSpread','2H_Over','ht_margin','actual_withot']
          filters={
            'all_context_nonnull':lambda s:s.dropna(subset=req),
            'h2_spread_nonzero':lambda s:s.dropna(subset=req)[lambda z:z['2H_HomeSpread']!=0],
            'h2_total_nonzero':lambda s:s.dropna(subset=req)[lambda z:z['2H_Over']!=0],
            'h2_both_nonzero':lambda s:s.dropna(subset=req)[lambda z:(z['2H_HomeSpread']!=0)&(z['2H_Over']!=0)],
            'totals_nonzero':lambda s:s.dropna(subset=req)[lambda z:(z['Over_AtOpen']!=0)&(z['Over_AtClose']!=0)&(z['2H_Over']!=0)],
            'all_odds_nonzero':lambda s:s.dropna(subset=req)[lambda z:(z[odds]!=0).all(axis=1)],
          }
          out={'filters':{},'zero_patterns':{}}
          candidates=[]
          for season,(lo,hi,tn,trmse) in periods.items():
            raw=m[(m.Date>=lo)&(m.Date<hi)].copy()
            clean=raw.dropna(subset=req)
            zp={c:int((clean[c]==0).sum()) for c in odds}
            out['zero_patterns'][season]=zp
            for fname,fn in filters.items():
              s=fn(raw)
              rmse=float(np.sqrt(np.mean((s.actual_withot-s.expected)**2)))
              out['filters'].setdefault(fname,{})[season]={'n':int(len(s)),'target_n':tn,'rmse':rmse,'target_rmse':trmse,'n_error':int(len(s)-tn),'rmse_error':float(rmse-trmse)}
            zz=clean[(clean[odds]==0).any(axis=1)].copy()
            if len(zz):
              candidates.append(zz[['GAME_ID','Date','HomeTeam','AwayTeam']+odds])
          if candidates: pd.concat(candidates).to_csv('research/v09_zero_odds_candidates.csv',index=False)
          Path('research/v09_baseline_rmse_audit.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/v09_baseline_rmse_audit.json research/v09_zero_odds_candidates.csv || true
          git commit -m "Identify exact v0.9 zero-odds clean filter" || exit 0
          git push origin HEAD:research/v09-h2-audit
