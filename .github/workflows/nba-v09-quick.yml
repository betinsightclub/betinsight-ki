name: NBA v0.9 quick convention check
on:
  push:
    branches: [research/nba-v09-reconstruct]
    paths:
      - 'quick/**'
      - '.github/workflows/nba-v09-quick.yml'
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - run: python quick/nba_v09_repricing_probe.py
